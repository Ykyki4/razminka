<style>
  main.game { justify-content: flex-start; }
  .shape {
    position: relative; width: min(100%, 380px); aspect-ratio: 32 / 26;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow-sm); display: grid; place-items: center;
  }
  .shape svg { width: 100%; height: 100%; }
  .shape path { fill: var(--text); stroke: var(--text); stroke-width: 0.6; stroke-linejoin: round; transition: fill 0.4s; }
  .shape.won path { fill: var(--correct); stroke: var(--correct); }
  .shape[data-name]::after {
    content: attr(data-name); position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 4px 12px; border-radius: 999px;
    font: 700 0.9rem var(--display); white-space: nowrap;
  }
  .pick-box { width: 100%; display: flex; justify-content: center; margin-top: auto; padding-bottom: 8px; }
</style>
