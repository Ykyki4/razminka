<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Страна</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232f9e6b%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 font-family=%22Arial%22 font-weight=%22900%22 text-anchor=%22middle%22 fill=%22white%22%3E%D0%A0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css?v=202610172025">
<style>
  main.game { justify-content: flex-start; max-width: 620px; }
  .cmp-head, .cmp-cells { display: grid; grid-template-columns: 1.1fr 0.9fr 1fr 1.1fr 1.2fr; gap: 5px; width: 100%; }
  .cmp-head span { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); text-align: center; }
  .cmp-list { width: 100%; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; min-height: 0; }
  .cmp { animation: rise 0.25s ease; }
  .cmp-name { font: 700 0.95rem var(--display); margin: 0 0 4px 2px; }
  .cmp.win .cmp-name { color: var(--correct); }
  .cmp-cells .cell {
    min-height: 46px; border-radius: 10px; display: grid; place-items: center; text-align: center;
    padding: 4px; font-size: 0.78rem; font-weight: 800; line-height: 1.15; color: #fff;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .cell[data-state="correct"] { background: var(--correct); }
  .cell[data-state="present"] { background: var(--present); }
  .cell[data-state="absent"] { background: var(--absent); }
  .cmp-empty { text-align: center; color: var(--muted); font-weight: 700; padding: 30px 10px; border: 2px dashed var(--line); border-radius: 14px; }
  .pick-box { width: 100%; display: flex; justify-content: center; padding-bottom: 8px; }
</style>
</head>
<body>
<main class="game"></main>
<script src="../data/geo.js?v=202610172025"></script>
<script src="../assets/core.js?v=202610172025"></script>
<script src="../assets/geo-core.js?v=202610172025"></script>
<script src="strana.js?v=202610172025"></script>
</body>
</html>
