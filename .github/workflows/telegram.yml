# Посты в Telegram-канал. Секреты репозитория: TG_TOKEN (токен бота), TG_CHAT (@канал).
# GitHub запускает расписание с опозданием (бывало и на несколько часов), сильнее всего — в начале
# часа, поэтому минуты нарочно некруглые и время чуть раньше нужного.
name: Telegram

on:
  schedule:
    - cron: "17 4 * * *" # 07:17 по Москве — задания дня готовы
    - cron: "17 9 * * *" # 12:17 по Москве — вчерашние ответы
  workflow_dispatch: # кнопка «Run workflow» — опубликовать прямо сейчас
    inputs:
      mode:
        description: "Какой пост"
        type: choice
        options: [morning, answers]
        default: morning

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/telegram_post.js
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '17 9 * * *' && 'answers' || 'morning') }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
